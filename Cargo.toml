[package]
name = "minimalist-list"
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
description = "A native, gesture-oriented minimalist task list built with egui"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
uuid = { version = "1", features = ["serde", "v4"] }
global-hotkey = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
x11rb = { version = "0.13", default-features = false }
x11-dl = "2.21"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
winresource = "0.1"
