[package]
name = "minimalist-list"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "A native, gesture-oriented minimalist task list built with egui"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
uuid = { version = "1", features = ["serde", "v4"] }
